[package]
name = "nexora-analysis-worker"
version = "0.4.0"
edition = "2024"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
futures-lite = "2"
lapin = { version = "4.12.3", default-features = false, features = ["rustls--ring", "tokio"] }
nexora-core = { git = "https://github.com/torogoz-tech/nexora-api.git", rev = "b595a23ef9a4e3c2ff63fa15dcfdaee9bc7291b1" }
nexora-indexer = { git = "https://github.com/torogoz-tech/nexora-api.git", rev = "b595a23ef9a4e3c2ff63fa15dcfdaee9bc7291b1" }
nexora-language = { git = "https://github.com/torogoz-tech/nexora-api.git", rev = "b595a23ef9a4e3c2ff63fa15dcfdaee9bc7291b1" }
nexora-platform = { git = "https://github.com/torogoz-tech/nexora-api.git", rev = "b595a23ef9a4e3c2ff63fa15dcfdaee9bc7291b1" }
nexora-platform-store = { git = "https://github.com/torogoz-tech/nexora-api.git", rev = "b595a23ef9a4e3c2ff63fa15dcfdaee9bc7291b1" }
nexora-reasoning = { git = "https://github.com/torogoz-tech/nexora-api.git", rev = "b595a23ef9a4e3c2ff63fa15dcfdaee9bc7291b1" }
nexora-runtime = { git = "https://github.com/torogoz-tech/nexora-api.git", rev = "b595a23ef9a4e3c2ff63fa15dcfdaee9bc7291b1" }
nexora-source = { git = "https://github.com/torogoz-tech/nexora-api.git", rev = "b595a23ef9a4e3c2ff63fa15dcfdaee9bc7291b1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "sync"] }
zeroize = "1"

[dev-dependencies]
serde_json = "1"
postgres = { version = "0.19", features = ["with-serde_json-1"] }
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
