[package]
name = "nexora-analysis-worker"
version = "0.4.0"
edition = "2024"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
futures-lite = "2"
lapin = { version = "4.12.3", default-features = false, features = ["rustls--ring", "tokio"] }
nexora-core = { git = "https://github.com/torogoz-tech/nexora-platform-contracts.git", tag = "0.4.0" }
nexora-indexer = { git = "https://github.com/torogoz-tech/nexora-analysis-engine.git", tag = "0.4.0" }
nexora-language = { git = "https://github.com/torogoz-tech/nexora-analysis-engine.git", tag = "0.4.0" }
nexora-platform = { git = "https://github.com/torogoz-tech/nexora-platform-contracts.git", tag = "0.4.0" }
nexora-platform-store = { git = "https://github.com/torogoz-tech/nexora-api.git", rev = "60a9f8091f1859499ba7d3f277287b01a3e84b90" }
nexora-reasoning = { git = "https://github.com/torogoz-tech/nexora-api.git", rev = "60a9f8091f1859499ba7d3f277287b01a3e84b90" }
nexora-runtime = { git = "https://github.com/torogoz-tech/nexora-job-store.git", rev = "1cedd26f9af3798d3d7475cc3190ac961726f7fe" }
nexora-source = { git = "https://github.com/torogoz-tech/nexora-analysis-engine.git", tag = "0.4.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "sync"] }
zeroize = "1"

[dev-dependencies]
serde_json = "1"
postgres = { version = "0.19", features = ["with-serde_json-1"] }
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
