[package]
name = "nexora-analysis-worker"
version = "0.4.0"
edition = "2024"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
futures-lite = "2"
lapin = { version = "4.12.3", default-features = false, features = ["rustls--ring", "tokio"] }
getrandom = "0.3"
nexora-analysis-store = { git = "https://github.com/torogoz-tech/nexora-job-store.git", rev = "a40b5b6ad666adf2fc3f5db0469f30b81282c159" }
nexora-core = { git = "https://github.com/torogoz-tech/nexora-platform-contracts.git", tag = "0.4.0" }
nexora-indexer = { git = "https://github.com/torogoz-tech/nexora-analysis-engine.git", tag = "0.4.0" }
nexora-knowledge-store = { git = "https://github.com/torogoz-tech/nexora-job-store.git", rev = "a40b5b6ad666adf2fc3f5db0469f30b81282c159" }
nexora-language = { git = "https://github.com/torogoz-tech/nexora-analysis-engine.git", tag = "0.4.0" }
nexora-platform = { git = "https://github.com/torogoz-tech/nexora-platform-contracts.git", tag = "0.4.0" }
nexora-reasoning = { git = "https://github.com/torogoz-tech/nexora-api.git", rev = "ff8832800286f407f891d74496ae933b69d6ae32", default-features = false }
nexora-runtime = { git = "https://github.com/torogoz-tech/nexora-job-store.git", rev = "a40b5b6ad666adf2fc3f5db0469f30b81282c159" }
nexora-source = { git = "https://github.com/torogoz-tech/nexora-analysis-engine.git", tag = "0.4.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "sync"] }
zeroize = "1"

[dev-dependencies]
nexora-platform-store = { git = "https://github.com/torogoz-tech/nexora-api.git", rev = "ff8832800286f407f891d74496ae933b69d6ae32" }
serde_json = "1"
postgres = { version = "0.19", features = ["with-serde_json-1"] }
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
