name: Rust
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: nexora
          POSTGRES_USER: nexora
          POSTGRES_PASSWORD: nexora-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexora -d nexora"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/nexora-test-only
        ports:
          - 7474:7474
        options: >-
          --health-cmd "cypher-shell -u neo4j -p nexora-test-only 'RETURN 1' >/dev/null"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup toolchain install 1.100.0 --profile minimal --no-self-update
      - run: rustup component add rustfmt clippy --toolchain 1.100.0
      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Configure integration-test connections
        env:
          REDIS_PASSWORD: nexora-test-only
        run: |
          redis_container="$(docker ps --filter 'ancestor=redis:7.4-alpine' --format '{{.ID}}' | head -n 1)"
          test -n "$redis_container"
          for attempt in $(seq 1 30); do
            if docker exec "$redis_container" redis-cli ping >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          docker exec "$redis_container" redis-cli CONFIG SET requirepass "$REDIS_PASSWORD"
          secrets_directory="$RUNNER_TEMP/nexora-analysis-test-secrets"
          mkdir -m 700 "$secrets_directory"
          printf '%s' 'nexora-test-only' > "$secrets_directory/postgres_password"
          printf '%s' '--requirepass=nexora-test-only' > "$secrets_directory/dragonfly_flags"
          printf '%s' 'neo4j/nexora-test-only' > "$secrets_directory/neo4j_auth"
          chmod 600 "$secrets_directory"/*
          cat > "$RUNNER_TEMP/nexora-analysis-test-connections.json" <<EOF
          {
            "schema_version": 1,
            "host": "127.0.0.1",
            "postgres_port": 5432,
            "redis_port": 6379,
            "neo4j_http_port": 7474,
            "postgres_database": "nexora",
            "postgres_user": "nexora",
            "secrets_directory": "$secrets_directory",
            "allow_remote_host": false
          }
          EOF
          chmod 600 "$RUNNER_TEMP/nexora-analysis-test-connections.json"
          echo "NEXORA_TEST_CONNECTIONS=$RUNNER_TEMP/nexora-analysis-test-connections.json" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.13.9"
          python-version: "3.11"
      - run: cargo fmt --all -- --check
      - run: cargo test --release --locked -- --include-ignored --test-threads=1
      - run: cargo clippy --release --all-targets --locked -- -D warnings
      - run: cargo build --release --locked --bin nexora-analysis-worker
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: nexora-analysis-worker-0.4.0
          path: target/release/nexora-analysis-worker
          if-no-files-found: error
          retention-days: 7
  image:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: nexora-analysis-worker-0.4.0
          path: image-context
      - run: chmod +x image-context/nexora-analysis-worker
      - name: Build runtime image
        run: docker build --build-context worker-artifact=image-context --tag nexora-analysis-worker:ci .
      - name: Smoke-test runtime
        run: |
          docker run --rm nexora-analysis-worker:ci --help > /tmp/nexora-analysis-worker-help.txt
          grep -q 'nexora-analysis-worker' /tmp/nexora-analysis-worker-help.txt
          docker run --rm --entrypoint /bin/sh nexora-analysis-worker:ci -ec 'test "$(id -u)" -ne 0 && git --version'
      - name: Publish image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          test -n "$GHCR_TOKEN" || { echo "GHCR_TOKEN is not configured" >&2; exit 1; }
          echo "$GHCR_TOKEN" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          docker tag nexora-analysis-worker:ci "ghcr.io/${GITHUB_REPOSITORY}:0.4.0"
          docker push "ghcr.io/${GITHUB_REPOSITORY}:0.4.0"
